<style>

<div class="wrap" id="app"></div>
<footer>Ricerca Crimini · strumento interattivo per la gestione dei tiri</footer>
<script type="text/javascript">
/* ============ HELPERS ============ */
function g(id){return document.getElementById(id);}
function num(id){var e=g(id);var v=e?parseFloat(e.value):0;return isNaN(v)?0:v;}
function fl(x){return Math.floor(x);}
function setTxt(id,t){var e=g(id);if(e)e.innerHTML=t;}
function setDice(id,t){var e=g(id);if(e)e.setAttribute('data-dice',t);}
function signText(v,label){if(!v)return '';return ' '+(v>0?'+':'')+v+' '+label;}
function effectiveThreshold(th,dieSides){var v=fl(th);if(v<0)v=0;if(v>dieSides)v=dieSides;return v;}
function dieState(id,dieSides){var e=g(id);if(!e||e.value==='')return {filled:false,valid:false,value:null};var v=Number(e.value);if(!isFinite(v)||Math.floor(v)!==v||v<1||v>dieSides)return {filled:true,valid:false,value:v};return {filled:true,valid:true,value:v};}
function doCopy(btn){var text=btn.getAttribute('data-dice')||'';var fb=btn.parentElement.querySelector('.dice-copied');function flash(){if(fb){fb.classList.add('show');setTimeout(function(){fb.classList.remove('show');},1400);}}function fallback(){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(flash).catch(function(){fallback();flash();});}else{fallback();flash();}}
function updateTag(resId,tagId,threshold,dieSides){var t=g(tagId);if(!t)return;var s=dieState(resId,dieSides);if(!s.filled){t.textContent='In attesa del tiro';t.className='tag';return;}if(!s.valid){t.textContent='Risultato impossibile: inserisci un intero da 1 a '+dieSides;t.className='tag invalid';return;}var th=effectiveThreshold(threshold,dieSides);if(s.value<=th){t.textContent='Successo ('+s.value+' ≤ '+th+')';t.className='tag ok';}else{t.textContent='Fallito ('+s.value+' > '+th+')';t.className='tag no';}}
function setFormulaPreview(fId,dieSides,threshold,formulaText){var th=effectiveThreshold(threshold,dieSides);var head=th<1?'1d'+dieSides+' — nessun risultato valido può riuscire':'1d'+dieSides+' — riesce se il risultato è tra 1 e '+th;setTxt(fId,'<b>'+head+'</b><br>'+threshold+' = '+formulaText);}
function setDiceButtonLabel(btnId,dieSides,threshold,i,extra){var btn=g(btnId);if(!btn)return;var th=effectiveThreshold(threshold,dieSides);btn.innerHTML='<span class="ico">🎲</span> Copia 1d'+dieSides+' — Riesce se 1-'+th+(extra?(' ('+extra+')'):'')+' — PG '+i;}
function pgStatsCardHTML(crime,n,fields){var out='';for(var i=1;i<=n;i++){var inputs=fields.map(function(f){var val=f.def!==undefined?f.def:'';return '<label class="field">'+f.label+'<input type="number" id="'+crime+'-'+f.key+i+'" value="'+val+'"'+(f.min!==undefined?' min="'+f.min+'"':'')+'></label>';}).join('');var rm=(i===n&&n>2)?' <span class="rm" data-action="remove-pg" data-crime="'+crime+'">rimuovi</span>':'';out+='<div class="pg-card"><h4>PG '+i+rm+'</h4><div class="pg-stat-grid">'+inputs+'</div></div>';}return out;}
function rollBlock(crime,phaseId,i,dieSides){var fId=crime+'-'+phaseId+'-f'+i,btnId=crime+'-'+phaseId+'-btn'+i,resId=crime+'-'+phaseId+'-res'+i,tagId=crime+'-'+phaseId+'-tag'+i;return '<div class="formula-preview" id="'+fId+'">calcolo in corso…</div><div class="dice-row"><button type="button" class="dice-btn" id="'+btnId+'" data-dice="" data-action="copy-dice"><span class="ico">🎲</span> Copia dado — PG '+i+'</button><span class="dice-copied">Copiato!</span></div><div class="result-row"><label class="field">Risultato ottenuto<input type="number" id="'+resId+'"></label><span class="tag" id="'+tagId+'">In attesa del tiro</span></div>';}
function selectHTML(id,scheme,wide){var opts=scheme.map(function(o){return '<option value="'+o[0]+'">'+o[1]+'</option>';}).join('');return '<select id="'+id+'"'+(wide?' class="wide"':'')+'>'+opts+'</select>';}
var BONUS_STD=[[0,'Nessun bonus'],[1,'+1'],[3,'+3'],[5,'+5']];
var BONUS_SICARIO_III=[[0,'Nessun bonus'],[5,'+5'],[7,'+7'],[10,'+10']];
var BONUS_K_STD=[[0,'Nessuna'],[1,'+1 — Conoscenza Scolastica'],[3,'+3 — Conoscenza Extra'],[5,'+5 — Conoscenza Avanzata']];
var BONUS_P_STD=[[0,'Nessuna'],[1,'+1 — Pozione Standard'],[3,'+3 — Pozione Oltre Ogni Previsione'],[5,'+5 — Pozione Eccezionale']];
var BONUS_K_SIC=[[0,'Nessuna'],[5,'+5 — Conoscenza Scolastica'],[7,'+7 — Conoscenza Extra'],[10,'+10 — Conoscenza Avanzata']];
var BONUS_P_SIC=[[0,'Nessuna'],[5,'+5 — Pozione Standard'],[7,'+7 — Pozione Oltre Ogni Previsione'],[10,'+10 — Pozione Eccezionale']];
function supportHTML(base,scheme,allowK,allowP){var high=(scheme===BONUS_SICARIO_III);var ks=high?BONUS_K_SIC:BONUS_K_STD;var ps=high?BONUS_P_SIC:BONUS_P_STD;var s='<div class="support-grid">';if(allowK!==false)s+='<label class="field">Conoscenza'+selectHTML(base+'-k',ks,true)+'</label>';if(allowP!==false)s+='<label class="field">Pozione'+selectHTML(base+'-p',ps,true)+'</label>';s+='<label class="field">Bonus Oggetto/Borsa<input type="number" id="'+base+'-obj" value="0"></label></div>';return s;}
function pressurePotionHTML(base,targets){return '<div class="support-grid"><label class="field">Pozione'+selectHTML(base+'-p',BONUS_P_STD,true)+'</label><label class="field">Voce modificata'+selectHTML(base+'-pt',targets,true)+'</label><label class="field">Bonus Oggetto/Borsa<input type="number" id="'+base+'-obj" value="0"></label></div>';}
function esitoBoxHTML(id){return '<div class="esito-box" id="'+id+'">In attesa dei risultati dei PG in questa fase.</div>';}
function phaseLockHTML(id){return '<div class="rc-note lock-note" id="'+id+'-lock"></div>';}
function setPhaseAccess(cardId,enabled,message){var card=g(cardId);if(!card)return;card.className=enabled?'card':'card locked';var els=card.querySelectorAll('input,select,button.dice-btn');for(var i=0;i<els.length;i++)els[i].disabled=!enabled;var note=g(cardId+'-lock');if(note){note.style.display=enabled?'none':'block';note.textContent=message||'Completa prima la fase precedente.';}}
function evalPhase(crime,phaseId,n,thresholds,rule,dieSides,forcedFail){var any=false,all=true,per=[],complete=true,valid=true;for(var i=1;i<=n;i++){if(forcedFail&&forcedFail[i-1]){per.push(false);all=false;continue;}var sides=(typeof dieSides==='object')?dieSides[i-1]:dieSides;var s=dieState(crime+'-'+phaseId+'-res'+i,sides);if(!s.filled){complete=false;per.push(null);continue;}if(!s.valid){valid=false;per.push(null);continue;}var ok=s.value<=effectiveThreshold(thresholds[i-1],sides);per.push(ok);if(ok)any=true;else all=false;}var success=(rule==='all')?all:any;return {complete:complete,valid:valid,success:success,perPG:per};}
function computeEsito(crime,phaseId,n,thresholds,rule,dieSides,forcedFail){var st=evalPhase(crime,phaseId,n,thresholds,rule,dieSides,forcedFail);var box=g(crime+'-'+phaseId+'-esito');if(!box)return st;if(!st.complete){box.className='esito-box';box.textContent='In attesa dei risultati di tutti i PG in questa fase.';return st;}if(!st.valid){box.className='esito-box';box.textContent='Uno o più risultati non sono validi per il dado indicato.';return st;}box.className='esito-box '+(st.success?'ok':'no');var regola=(rule==='all')?'Serve che TUTTI i PG abbiano successo.':'Basta che ALMENO UN PG abbia successo.';box.textContent=(st.success?'Esito Fase: SUCCESSO — ':'Esito Fase: FALLIMENTO — ')+regola;return st;}
function setBox(id,state,text){var e=g(id);if(!e)return;e.className='esito-box'+(state?(' '+state):'');e.textContent=text;}
function syncSelect(id,options){var s=g(id);if(!s)return;var old=s.value;var html='';for(var i=0;i<options.length;i++)html+='<option value="'+options[i][0]+'">'+options[i][1]+'</option>';s.innerHTML=html;var found=false;for(var j=0;j<options.length;j++)if(String(options[j][0])===String(old))found=true;if(found)s.value=old;}

/* ============ APP SHELL ============ */
function buildShell(){var html='<header class="hero"><div class="eyebrow">Mondo Magico Oscuro</div><h1>Ricerca Crimini</h1><p>Uno strumento guidato, passo per passo, per svolgere la Ricerca Crimini: tira i dadi copiandoli direttamente nel forum, registra i risultati e lascia che la pagina calcoli soglie e bonus per te.</p></header><div class="rules-box"><details><summary>Regole generali da ricordare</summary><ul><li>Massimo <b>1 Conoscenza</b> e <b>1 Pozione</b> per post; quando entrambe sono applicabili, i bonus si sommano e valgono solo per la fase in cui vengono usati.</li><li>Quando una formula prevede una divisione, il risultato viene sempre <b>arrotondato per difetto</b>.</li><li>Incantesimi e Conoscenze hanno riuscita narrativa al 100% dove non specificato altrimenti: i dadi determinano l’esito complessivo.</li><li>Un PG è “scoperto” solo se identificato con certezza o fermato/catturato.</li><li>Servono almeno <b>2 PG</b> e <b>tutti i partecipanti</b> devono possedere almeno uno dei requisiti: Intracciabile, Malvagio oppure almeno 20 Punti Sinistri. La role è sempre free-role.</li><li>L’esecuzione può avvenire in Gran Bretagna o all’estero secondo le regole del mandante; eventuali spostamenti usati anche per altre giocate restano a carico dei PG.</li><li>Gli eventuali bonus di Oggetti/Borsa vanno inseriti solo quando previsti dal Prezzario. I campi delle statistiche sono volutamente vuoti: inserisci sempre i valori reali del PG; se un valore è realmente 0, scrivi 0.</li><li>Successo senza essere identificati: +1 Punto Sinistro (una volta), 2 Galeoni e 2 PP per post (max 5 post). Fallimento: solo +2 PP per post (max 5 post). I premi non sono cumulabili con quelli delle Missioni Caotiche del FantaWiz.</li></ul></details></div><div class="step-marker"><div class="num">1</div><h2>Per prima cosa, scopriamo quale Crimine dovrai compiere</h2><div class="line"></div></div><div class="card"><p class="desc">Lancia il dado per determinare quale Crimine viene commissionato dal PNG o PPNG. Il compenso del mandante è solo narrativo.</p><div class="dice-row"><button type="button" class="dice-btn" data-dice="[dice=1d5]Determinazione del Crimine[/dice]" data-action="copy-dice"><span class="ico">🎲</span> Copia dado — Tipo di Crimine</button><span class="dice-copied">Copiato!</span></div><div class="rc-note">1: Furto · 2: Contrabbando · 3: Pressione Psicologica · 4: Sicario · 5: Affari Clandestini.</div></div><div class="step-marker"><div class="num">2</div><h2>Segui passo per passo la scheda del Crimine assegnato</h2><div class="line"></div></div><nav class="crime-nav"><button id="nav-btn-furto" class="active" data-action="show-crime" data-crime="furto">1 · Furto</button><button id="nav-btn-contrabbando" data-action="show-crime" data-crime="contrabbando">2 · Contrabbando</button><button id="nav-btn-pressione" data-action="show-crime" data-crime="pressione">3 · Pressione Psicologica</button><button id="nav-btn-sicario" data-action="show-crime" data-crime="sicario">4 · Sicario</button><button id="nav-btn-affari" data-action="show-crime" data-crime="affari">5 · Affari Clandestini</button></nav><section class="crime-section active" id="section-furto"></section><section class="crime-section" id="section-contrabbando"></section><section class="crime-section" id="section-pressione"></section><section class="crime-section" id="section-sicario"></section><section class="crime-section" id="section-affari"></section>';g('app').innerHTML=html;}

/* ============ CRIME STATE ============ */
var PG_COUNT={furto:2,contrabbando:2,pressione:2,sicario:2,affari:2};
var RENDERERS={};
var PHASE_ORDER={furto:['faseI1','faseI2','faseII','faseIII'],contrabbando:['faseI','faseII','faseIII'],pressione:['faseI','faseII','faseIII'],sicario:['faseI','faseII','faseIII'],affari:['faseI','faseII','faseIII']};
function snapshotValues(container){var map={};var els=container.querySelectorAll('input,select');for(var i=0;i<els.length;i++)map[els[i].id]=els[i].value;return map;}
function restoreValues(container,map){var els=container.querySelectorAll('input,select');for(var i=0;i<els.length;i++)if(map.hasOwnProperty(els[i].id))els[i].value=map[els[i].id];}
function clearPhaseResults(crime,phaseId){var c=g('section-'+crime);if(!c)return;var els=c.querySelectorAll('input');var pref=crime+'-'+phaseId+'-res';for(var i=0;i<els.length;i++)if(els[i].id.indexOf(pref)===0)els[i].value='';if(crime==='contrabbando'&&phaseId==='faseII'){var r=g('contrabbando-mezzo-res');if(r)r.value='';}}
function clearFromPhase(crime,phaseId,includeCurrent){var order=PHASE_ORDER[crime]||[];var pos=-1;for(var i=0;i<order.length;i++)if(order[i]===phaseId){pos=i;break;}if(pos<0)return;var start=includeCurrent?pos:pos+1;for(var j=start;j<order.length;j++)clearPhaseResults(crime,order[j]);}
function clearAllRollResults(crime){var order=PHASE_ORDER[crime]||[];for(var i=0;i<order.length;i++)clearPhaseResults(crime,order[i]);}
function phaseCardIdOf(target){var root=g('rc-crimini'),n=target;while(n&&n!==root){if(n.id&&n.id.indexOf('-card')>0&&(' '+n.className+' ').indexOf(' card ')>=0)return n.id;n=n.parentNode;}return '';}
function phaseFromCardId(crime,cardId){var pref=crime+'-',suf='-card';if(cardId.indexOf(pref)!==0||cardId.slice(-suf.length)!==suf)return '';return cardId.slice(pref.length,-suf.length);}
function isPhaseResultId(crime,phaseId,id){return id.indexOf(crime+'-'+phaseId+'-res')===0||(crime==='contrabbando'&&phaseId==='faseII'&&id==='contrabbando-mezzo-res');}
function invalidateForChange(crime,target){if(!target||!target.id)return;var id=target.id,cardId=phaseCardIdOf(target),phase=phaseFromCardId(crime,cardId);if(phase){if(isPhaseResultId(crime,phase,id))clearFromPhase(crime,phase,false);else clearFromPhase(crime,phase,true);return;}if(crime==='pressione'&&id==='pressione-profilo'){clearFromPhase(crime,'faseIII',true);return;}if(crime==='sicario'&&id==='sicario-incarico'){clearFromPhase(crime,'faseIII',true);return;}if(id===crime+'-bottino'||id===crime+'-carico'||id===crime+'-profilo'||id.indexOf(crime+'-')===0){clearAllRollResults(crime);}}
function addPG(crime){clearAllRollResults(crime);PG_COUNT[crime]++;rerender(crime);}
function removePG(crime){if(PG_COUNT[crime]>2){clearAllRollResults(crime);PG_COUNT[crime]--;rerender(crime);}}
function rerender(crime){var c=g('section-'+crime);var snap=snapshotValues(c);c.innerHTML=RENDERERS[crime].render(PG_COUNT[crime]);restoreValues(c,snap);RENDERERS[crime].recompute(PG_COUNT[crime]);}

var EVT='cli'+'ck';

<script type="text/javascript">
(function(){
  var root=document.getElementById('rc-crimini');
  if(!root)return;
  var timer=null;
  function misura(){
    var rect=root.getBoundingClientRect();
    return Math.max(200,Math.ceil(rect.bottom+window.pageYOffset+8));
  }
  function invia(){
    if(timer)clearTimeout(timer);
    timer=setTimeout(function(){
      try{window.parent.postMessage({tipo:'altezzaRicercaCrimini',altezza:misura()},'*');}catch(e){}
    },20);
  }
  window.addEventListener('load',invia);
  window.addEventListener('resize',invia);
  document.addEventListener('click',function(){setTimeout(invia,30);setTimeout(invia,180);});
  document.addEventListener('change',invia);
  document.addEventListener('input',invia);
  if(window.ResizeObserver){try{new ResizeObserver(invia).observe(root);}catch(e){}}
  if(window.MutationObserver){try{new MutationObserver(invia).observe(root,{subtree:true,childList:true,attributes:true,characterData:true});}catch(e){}}
  setTimeout(invia,50);setTimeout(invia,300);setTimeout(invia,1000);
})();
</script></div>
